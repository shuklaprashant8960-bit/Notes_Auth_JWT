<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Personal Notes</h1>

        <!-- Signup -->
        <div id="signup">
            <h2>Signup</h2>
            <input type="text" id="signup-username" placeholder="Username">
            <input type="password" id="signup-password" placeholder="Password">
            <button onclick="signup()" id="signup-btn">Signup</button>
        </div>

        <!-- Signin -->
        <div id="signin">
            <h2>Signin</h2>
            <input type="text" id="signin-username" placeholder="Username">
            <input type="password" id="signin-password" placeholder="Password">
            <button onclick="signin()" id="signin-btn">Signin</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard">
            <h2>My Notes</h2>

            <input type="text" id="note-input" placeholder="Write a note">
            <button onclick="addNote()" id="add-note">Add Note</button>

            <div id="notes-list"></div>

            <button id="logout">Logout</button>
        </div>

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"></script>


    <script src="script.js"></script>
</body>
</html>
